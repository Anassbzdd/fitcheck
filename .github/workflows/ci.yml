name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff + mypy strict
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy --strict
        run: mypy --strict fitcheck/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          
      - name: Run tests
        run: pytest --cov=fitcheck --cov-report=term-missing --cov-report=xml -m "not network"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  floor:
    name: Lowest declared dependencies (3.10)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package at the lowest declared versions
        run: uv pip install --system -e ".[dev]" --resolution lowest-direct

      - name: Show what was resolved
        run: uv pip list --system

      - name: Import the package
        run: python -c "import fitcheck; print(fitcheck.__version__)"

      - name: Run tests
        run: pytest -m "not network"

  build:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install dist/*.whl

      - name: Metadata matches pyproject.toml
        run: |
          /tmp/wheel-env/bin/python - <<'PY'
          import tomllib
          from importlib.metadata import requires

          with open("pyproject.toml", "rb") as handle:
              declared = tomllib.load(handle)["project"]["dependencies"]

          # Runtime requirements only: extras carry a `; extra == "..."` marker.
          installed = [r for r in (requires("fitcheck-llm") or []) if "extra ==" not in r]

          def norm(specs):
              return sorted(s.replace(" ", "").lower() for s in specs)

          if norm(declared) != norm(installed):
              raise SystemExit(
                  f"wheel metadata drifted from pyproject.toml\n"
                  f"  pyproject: {norm(declared)}\n"
                  f"  wheel:     {norm(installed)}"
              )
          print("runtime dependencies match:", norm(installed))
          PY

      - name: CLI smoke tests
        run: |
          /tmp/wheel-env/bin/fitcheck --version
          /tmp/wheel-env/bin/fitcheck --help
          /tmp/wheel-env/bin/fitcheck --list-gpus
          /tmp/wheel-env/bin/python -m fitcheck --version

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
