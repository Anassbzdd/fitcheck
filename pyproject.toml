[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[project]
name = "fitcheck-llm"
version = "0.1.0"
description = "Predict GPU VRAM requirements for LLM training before you start — model weights, LoRA/QLoRA, optimizer states, gradients, activations, and Flash Attention, checked against real GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Anas Bouzid" , email = "bouzidanas646@gmail.com"}
]
keywords = ["llm", "gpu", "vram", "fine-tuning", "lora", "qlora", "cli", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
 
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "huggingface-hub>=0.20",
]
 
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
 
[project.scripts]
fitcheck = "fitcheck.cli:main"
 
[project.urls]
Homepage = "https://github.com/Anassbzdd/fitcheck"
Repository = "https://github.com/Anassbzdd/fitcheck"
Issues = "https://github.com/Anassbzdd/fitcheck/issues"
 
[tool.hatch.build.targets.wheel]
packages = ["fitcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fitcheck"
markers = [
    "network: tests that make real network calls to Hugging Face Hub",
]