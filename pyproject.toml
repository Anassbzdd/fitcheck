[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[project]
name = "fitcheck-llm"
version = "0.3.0"
description = "Predict GPU VRAM requirements for LLM training before you start — model weights, LoRA/QLoRA, optimizer states, gradients, activations, and Flash Attention, checked against real GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Anas Bouzid" , email = "bouzidanas646@gmail.com"}
]
keywords = ["llm", "gpu", "vram", "fine-tuning", "lora", "qlora", "cli", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
 
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "huggingface-hub>=0.25",
]
 
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    # Floors are the versions the rule set and the strict run were verified against;
    # a lint tool that drifts below them reports a different set of findings.
    "ruff>=0.16",
    "mypy>=2.3",
]
 
[project.scripts]
fitcheck = "fitcheck.cli:main"
 
[project.urls]
Homepage = "https://github.com/Anassbzdd/fitcheck"
Repository = "https://github.com/Anassbzdd/fitcheck"
Issues = "https://github.com/Anassbzdd/fitcheck/issues"
 
[tool.hatch.build.targets.wheel]
packages = ["fitcheck"]

[tool.hatch.build.targets.sdist]
# .claude holds local tool settings and a stale worktree snapshot of the whole
# project; neither belongs in a published release.
exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fitcheck"
markers = [
    "network: tests that make real network calls to Hugging Face Hub",
]
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["fitcheck", "scripts", "tests"]
# The notebooks are measurement artifacts — they record what a specific GPU did on a
# specific day and are re-run, not refactored. Linting them would invite edits that
# invalidate their saved outputs.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # The formulas are written with their real symbols (gamma, mu, the multiplication
    # sign). Renaming them to ASCII lookalikes would make the code disagree with SPEC.md.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# An aliased member should not be torn out into a second import statement from the
# same module (estimator.py imports one private helper under a readable name).
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["fitcheck"]
