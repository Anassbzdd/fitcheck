name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          
      - name: Run tests
        run: pytest --cov=fitcheck --cov-report=term-missing --cov-report=xml -m "not network"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # The declared floor is a promise: anyone whose resolver lands on the lowest legal
  # version of a direct dependency must still get a working install. The `test` job
  # above always resolves to the newest release, so it can never catch a wrong pin.
  # `--resolution lowest-direct` is a uv flag; pip has no equivalent.
  floor:
    name: Lowest declared dependencies (3.10)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package at the lowest declared versions
        run: uv pip install --system -e ".[dev]" --resolution lowest-direct

      - name: Show what was resolved
        run: uv pip list --system

      - name: Import the package
        run: python -c "import fitcheck; print(fitcheck.__version__)"

      - name: Run tests
        run: pytest -m "not network"
